# Independently authored; see docs/research/upstream-compose.md.
services:
  postgres:
    image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    restart: unless-stopped
    env_file: /opt/mattermost/postgres.env
    volumes:
      - /srv/mattermost/postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mmuser -d mattermost']
      interval: 10s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  mattermost:
    image: mattermost/mattermost-team-edition:11.7.0@sha256:a9f01466ea96b559688fd67b07e6a1d381530a7888c74b87c4358869e5f1f06b
    restart: unless-stopped
    user: '2000:2000'
    env_file: /opt/mattermost/mattermost.env
    environment:
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_LOGSETTINGS_ENABLEFILE: 'false'
      MM_SERVICESETTINGS_ENABLELOCALMODE: 'true'
    ports: ['127.0.0.1:8065:8065']
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - /srv/mattermost/config:/mattermost/config:Z
      - /srv/mattermost/files:/mattermost/data:Z
      - /srv/mattermost/logs:/mattermost/logs:Z
      - /srv/mattermost/plugins:/mattermost/plugins:Z
      - /srv/mattermost/client-plugins:/mattermost/client/plugins:Z
      - /srv/mattermost/bleve-indexes:/mattermost/bleve-indexes:Z
    healthcheck:
      test: [CMD, /mattermost/bin/mmctl, --local, system, status]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
